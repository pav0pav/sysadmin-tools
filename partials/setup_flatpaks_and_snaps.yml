- name: Flatpak Management
  hosts: all
  become: true
  tasks:
    - name: Add flathub remote repository
      flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: system

    - name: Install snap packages
      snap:
         name:
           - gradia
           - chromium
         state: present
